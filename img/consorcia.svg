        <text x="558" y="380" fill="#8b98a8">Residencias Sur</text><rect x="764" y="366" width="58" height="22" rx="6" fill="#60a5fa" fill-opacity=".15"/><text x="793" y="382" fill="#60a5fa" text-anchor="middle" font-size="11">en curso</text>
